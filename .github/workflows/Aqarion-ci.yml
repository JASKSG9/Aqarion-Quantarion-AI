name: AQARION CI


on:
push:
branches:
- main
pull_request:
branches:
- main
workflow_dispatch:


permissions:
contents: read


jobs:
mutation-test:
name: Layer 1 — Mutation Detection
runs-on: ubuntu-latest


steps:
  - name: Checkout
    uses: actions/checkout@v4

  - name: Setup Python
    uses: actions/setup-python@v5
    with:
      python-version: "3.11"
      cache: pip

  - name: Install dependency
    run: python -m pip install --disable-pip-version-check numpy

  - name: Run mutation gate
    run: python tests/mutation_test.py



canonical-receipt:
name: Layer 2 — Canonical Receipt
runs-on: ubuntu-latest
needs:
- mutation-test


steps:
  - name: Checkout
    uses: actions/checkout@v4

  - name: Setup Python
    uses: actions/setup-python@v5
    with:
      python-version: "3.11"
      cache: pip

  - name: Install dependency
    run: python -m pip install --disable-pip-version-check numpy

  - name: R1 — BRT rank receipt
    run: python tests/test_brt_q54.py

  - name: R2 — AQ-001 receipt
    run: python tests/test_aq001.py

  - name: R3 — depth partition receipt
    run: python tests/test_depth_exact.py

  - name: R4 — Frobenius receipt
    run: python tests/test_frob_equal.py



exploratory:
name: Layer 3 — Exploratory Workloads
runs-on: ubuntu-latest
needs:
- canonical-receipt


steps:
  - name: Checkout
    uses: actions/checkout@v4

  - name: Setup Python
    uses: actions/setup-python@v5
    with:
      python-version: "3.11"
      cache: pip

  - name: Install dependency
    run: python -m pip install --disable-pip-version-check numpy

  - name: Support-spectrum workload
    run: python tests/support_spectrum.py

  - name: T10 workload
    run: python tests/test_t10.py


