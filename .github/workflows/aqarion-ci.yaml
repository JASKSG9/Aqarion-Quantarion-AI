name: AQARION-ARITHMETIC CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:

  mutation-test:
    name: Layer 1 — Mutation Detection
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install numerical dependency
        run: python -m pip install numpy --quiet

      - name: Run operator mutation test
        run: python tests/mutation-tests.py


  canonical-receipt:
    name: Layer 2 — Canonical Receipt
    runs-on: ubuntu-latest
    needs: mutation-test

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install numerical dependency
        run: python -m pip install numpy --quiet

      - name: BRT on Q54
        run: python tests/test-brt-q54.py

      - name: AQ-001 congruence equivalence
        run: python tests/aq-001.py

      - name: Depth exact quotient
        run: python tests/test-depth-exact.py

      - name: Frobenius norm formula
        run: python tests/test-frob-equal.py


  support-spectrum:
    name: Layer 3a — Support Spectrum Workload
    runs-on: ubuntu-latest
    needs: canonical-receipt

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install numerical dependency
        run: python -m pip install numpy --quiet

      - name: Run support-spectrum workload
        run: python tests/test-support-spectrum.py


  t10-workload:
    name: Layer 3b — T10 Workload
    runs-on: ubuntu-latest
    needs: canonical-receipt

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install numerical dependency
        run: python -m pip install numpy --quiet

      - name: Run T10 workload
        run: python tests/test-t10.py


  reproducibility-contract:
    name: Layer 4 — Reproduction Contract
    runs-on: ubuntu-latest
    needs: canonical-receipt

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run reproduction-contract adversarial tests
        run: python tests/test-reproduction-contract.py
