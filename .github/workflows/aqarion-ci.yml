name: AQARION-ARITHMETIC CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:

  mutation-test:
    name: Layer 1 — Mutation Detection
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install numerical dependency
        run: pip install numpy --quiet

      - name: Run operator mutation test
        run: python3 TESTS/mutation_test.py


  canonical-receipt:
    name: Layer 2 — Canonical Receipt
    runs-on: ubuntu-latest
    needs: mutation-test

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install numerical dependency
        run: pip install numpy --quiet

      - name: BRT on Q54
        run: python3 TESTS/test_brt_q54.py

      - name: AQ-001 congruence equivalence
        run: python3 TESTS/test_aq001.py

      - name: Depth exact quotient
        run: python3 TESTS/test_depth_exact.py

      - name: Frobenius norm formula
        run: python3 TESTS/test_frob_equal.py


  support-spectrum:
    name: Layer 3a — Support Spectrum
    runs-on: ubuntu-latest
    needs: canonical-receipt

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install numerical dependency
        run: pip install numpy --quiet

      - name: Support-spectrum workload
        run: python3 TESTS/test_support_spectrum.py


  t10-workload:
    name: Layer 3b — T10 Workload
    runs-on: ubuntu-latest
    needs: canonical-receipt

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install numerical dependency
        run: pip install numpy --quiet

      - name: T10 workload
        run: python3 TESTS/test_t10.py
