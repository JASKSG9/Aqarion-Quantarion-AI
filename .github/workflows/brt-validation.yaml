name: AQARION BRT Validation

on:
  push:
    branches: [main]
    paths:
      - "verify.sh"
      - "PUBLIC-DELIVERABLES/**"
      - "verification/**"
      - ".github/workflows/brt-validation.yaml"
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: BRT validation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout exact revision
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Verify required files
        run: |
          test -f verify.sh
          test -f PUBLIC-DELIVERABLES/DELIVERY_MANIFEST.json
          python -m json.tool PUBLIC-DELIVERABLES/DELIVERY_MANIFEST.json > /dev/null

      - name: Make verifier executable
        run: chmod +x ./verify.sh

      - name: Run BRT verification
        run: |
          set -o pipefail
          ./verify.sh 2>&1 | tee brt-validation.log

      - name: Upload validation log
        uses: actions/upload-artifact@v4
        with:
          name: brt-validation-log
          path: brt-validation.log
          if-no-files-found: error
