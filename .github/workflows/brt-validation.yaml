name: AQARION BRT Validation & Sync

on:
  push:
    branches: [ master ]

jobs:
  validate-and-alert:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run BRT Validation Script
        id: verify
        run: |
          chmod +x ./verify.sh
          ./verify.sh

      - name: Send Email Alert on Failure
        if: failure()
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: ${{ secrets.SMTP_SERVER }}
          server_port: 465
          username: ${{ secrets.SMTP_USERNAME }}
          password: ${{ secrets.SMTP_PASSWORD }}
          subject: "[ALERT] AQARION-BRT CI Build Failure on Master"
          to: ${{ secrets.ALERT_EMAIL }}
          from: "AQARION CI <ci@aqarion.local>"
          body: "The automated validation step failed for commit ${{ github.sha }}. Check workflow logs for BRT normalization and semantic control errors."
