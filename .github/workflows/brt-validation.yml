name: AQARION BRT Kernel Validation

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: brt-validation-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validation:
    name: BRT Exact Validation
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install numpy
        run: pip install numpy

      - name: Make verify.sh executable
        run: chmod +x ./verify.sh

      - name: Run BRT verifier
        run: |
          set -o pipefail
          ./verify.sh 2>&1 | tee verification.log

      - name: Upload verification log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: brt-verification-${{ github.sha }}
          path: verification.log
          retention-days: 30

      - name: Email on failure
        if: failure()
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: ${{ secrets.MAIL_SERVER }}
          server_port: ${{ secrets.MAIL_PORT }}
          username: ${{ secrets.MAIL_USERNAME }}
          password: ${{ secrets.MAIL_PASSWORD }}
          subject: "FAILED: AQARION BRT Validation (${{ github.sha }})"
          to: ${{ secrets.ALERT_EMAIL_RECIPIENT }}
          from: "AQARION Monitor <${{ secrets.MAIL_USERNAME }}>"
          body: |
            BRT validation FAILED.
            Commit: ${{ github.sha }}
            Ref:    ${{ github.ref }}
            Actor:  ${{ github.actor }}
            Run:    https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
            Governance: PROMOTION=false · C4=BLOCKED
