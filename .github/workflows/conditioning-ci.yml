name: AQARION Conditioning Verification

on:
  push:
    branches:
      - main
    paths:
      - "verification/aq-conditioning/**"
      - ".github/workflows/conditioning-ci.yaml"
  pull_request:
    paths:
      - "verification/aq-conditioning/**"
      - ".github/workflows/conditioning-ci.yaml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  aq-conditioning:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ./verification/aq-conditioning

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install NumPy
        run: python -m pip install numpy

      - name: Check required files
        run: |
          test -f aq_conditioning/__init__.py
          test -f aq_conditioning/self_audit.py
          test -f aq_conditioning/replay.py
          test -f verification/metamorphic.py
          test -f verification/mutation/executor.py

      - name: Run self-audit
        run: python -m aq_conditioning.self_audit

      - name: Run replay
        run: python -m aq_conditioning.replay

      - name: Run metamorphic test
        run: PYTHONPATH=. python verification/metamorphic.py

      - name: Run mutation test
        run: PYTHONPATH=. python verification/mutation/executor.py

      - name: Validate receipt
        run: |
          test -f artifacts/conditioning-receipt.json
          python -m json.tool artifacts/conditioning-receipt.json > /dev/null

      - name: Upload receipt
        uses: actions/upload-artifact@v4
        with:
          name: aq-conditioning-receipt
          path: verification/aq-conditioning/artifacts/conditioning-receipt.json
          if-no-files-found: error
