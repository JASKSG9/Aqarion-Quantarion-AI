name: sv-001-v2 replay contract
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  sv-001-v2:
    name: sv-001-v2 full replay
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: install numpy
        run: python -m pip install --upgrade pip numpy
      - name: verify canonical files exist (lowercase sv-001-v2)
        run: |
          test -f verification/sv-001-v2/contract.json
          test -f verification/sv-001-v2/oracle.py
          test -f verification/sv-001-v2/verifier.py
          test -f verification/sv-001-v2/replay.py
          test -f verification/sv-001-v2/mutation/executor.py
          test -f verification/sv-001-v2/mutation/metamorphic.py
          test -f verification/sv-001-v2/receipt/schema.json
          test -f verification/sv-001-v2/receipt/writer.py
      - name: reject deprecated 5720 domain and uppercase boulders
        run: |
         ! grep -R '"cases"[[:space:]]*:[[:space:]]*5720' verification/sv-001-v2
         ! grep -R 'VERIFICATION/SV-001' verification/ aqarion.toml claims/.github/workflows/sv-001-v2.yml || true
      - name: run sv-001-v2 verifier
        run: python verification/sv-001-v2/verifier.py
      - name: run sv-001-v2 mutation executor
        run: python verification/sv-001-v2/mutation/executor.py
      - name: run sv-001-v2 metamorphic checks
        run: python verification/sv-001-v2/mutation/metamorphic.py
      - name: generate sv-001-v2 replay receipt
        run: python verification/sv-001-v2/replay.py
      - name: validate sv-001-v2 receipt json
        run: python -m json.tool verification/sv-001-v2/receipt/latest.json > /dev/null
      - name: verify sv-001-v2 receipt hash binding
        run: |
          python - <<'PY'
          import hashlib, json
          from pathlib import Path
          root=Path("verification/sv-001-v2")
          receipt=json.loads((root/"receipt/latest.json").read_text())
