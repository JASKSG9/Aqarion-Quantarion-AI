name: AQARION Verification

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy

      - name: Compile verification
        run: |
          python -m compileall -q verification

      - name: Repository self-audit
        run: |
          python verification/repo_self_audit.py

      - name: Reject deprecated 5720 execution domain
        run: |
          if grep -R -n '"cases"[[:space:]]*:[[:space:]]*5720' \
              verification/sv-001-v2; then
            echo "ERROR: deprecated 5720 domain detected as active data"
            exit 1
          fi

      - name: Run SV-001-V2 oracle census
        run: |
          python verification/sv-001-v2/oracle.py

      - name: Run SV-001-V2 matrix verifier
        run: |
          python verification/sv-001-v2/verifier.py

      - name: Run SV-001-V2 metamorphic tests
        run: |
          python verification/sv-001-v2/mutation/metamorphic.py

      - name: Run SV-001-V2 mutation tests
        run: |
          python verification/sv-001-v2/mutation/executor.py

      - name: Generate SV-001-V2 runtime receipt
        run: |
          mkdir -p artifacts/SV-001-V2
          python verification/sv-001-v2/replay.py \
            --receipt artifacts/SV-001-V2/receipt.json

      - name: Validate SV-001-V2 receipt
        run: |
          python verification/sv-001-v2/receipt/writer.py \
            artifacts/SV-001-V2/receipt.json

      - name: Bind receipt to commit
        env:
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          r = json.loads(Path("artifacts/SV-001-V2/receipt.json").read_text())
          assert r["binding"]["git_commit"] == os.environ["EXPECTED_SHA"], "commit mismatch"
          assert r["status"] == "PASS"
          assert r["verification"]["failures"] == 0
          assert r["domain"]["cases"] == 1176
          assert r["domain"]["zero_r"] == 196
          assert r["domain"]["nonzero_r"] == 980
          print("receipt_binding=PASS")
          PY

      - name: Upload receipt
        uses: actions/upload-artifact@v4
        with:
          name: sv001-v2-receipt
          path: artifacts/SV-001-V2/receipt.json
