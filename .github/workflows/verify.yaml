name: AQARION Replay

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  replay:
    name: AQARION executable replay
    runs-on: ubuntu-latest

    steps:
      - name: Checkout exact repository revision
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Show repository revision
        run: |
          git rev-parse HEAD
          git rev-parse HEAD^{tree}

      - name: Compile verification Python
        run: |
          python3 -m compileall -q verification

      - name: Run canonical verification runner
        run: |
          python3 verification/run-all.py \
            --manifest verification/manifest.json \
            --receipt verification/receipts/run_all_receipt.json

      - name: Validate self-bound verification receipt
        env:
          EXPECTED_COMMIT: ${{ github.sha }}
        run: |
          python3 - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path

          receipt_path = Path(
              "verification/receipts/run_all_receipt.json"
          )
          manifest_path = Path(
              "verification/manifest.json"
          )

          if not receipt_path.is_file():
              raise SystemExit(
                  "FAIL: verification receipt missing"
              )

          data = json.loads(
              receipt_path.read_text(
                  encoding="utf-8"
              )
          )

          if data.get("schema") != "AQARION-RUN-RECEIPT-2":
              raise SystemExit(
                  "FAIL: incorrect receipt schema"
              )

          if data.get("status") != "PASS":
              raise SystemExit(
                  f"FAIL: receipt status is "
                  f"{data.get('status')!r}"
              )

          expected_commit = os.environ["EXPECTED_COMMIT"]
          actual_commit = (
              data.get("source", {}).get("commit")
          )

          if actual_commit != expected_commit:
              raise SystemExit(
                  "FAIL: receipt commit does not "
                  "equal GITHUB_SHA"
              )

          expected_manifest_sha = hashlib.sha256(
              manifest_path.read_bytes()
          ).hexdigest()

          actual_manifest_sha = (
              data.get("manifest", {}).get("sha256")
          )

          if actual_manifest_sha != expected_manifest_sha:
              raise SystemExit(
                  "FAIL: manifest SHA256 mismatch"
              )

          checks = data.get("checks")

          if not isinstance(checks, list) or not checks:
              raise SystemExit(
                  "FAIL: checks invalid"
              )

          failed = [
              check
              for check in checks
              if check.get("status") != "PASS"
          ]

          if failed:
              raise SystemExit(
                  "FAIL: non-PASS checks: "
                  + repr(failed)
              )

          print(
              "PASS: self-bound Receipt-2 verified"
          )
          PY

      - name: Display verification receipt
        run: |
          cat verification/receipts/run_all_receipt.json
