# AQARION repository manifest
# Exact path: aqarion.toml (repository root)

[project]
name = "aqarions-quantarion-ai"
manifest_version = "ARC-1.0"

[environment]
python = ">=3.11"
requires = ["numpy"]

[claim.SV-001-V2]
contract          = "verification/sv-001-v2/contract.json"
oracle            = "verification/sv-001-v2/oracle.py"
verifier          = "verification/sv-001-v2/verifier.py"
replay            = "verification/sv-001-v2/replay.py"
mutation_executor = "verification/sv-001-v2/mutation/executor.py"
metamorphic_tests = "verification/sv-001-v2/mutation/metamorphic.py"
receipt_schema    = "verification/sv-001-v2/receipt/schema.json"
receipt_writer    = "verification/sv-001-v2/receipt/writer.py"

[verification]
manifest   = "verification/manifest.json"
self_audit = "verification/repo-self-audit.py"
workflow   = ".github/workflows/sv-001-v2.yaml"

[governance]
C4                = "BLOCKED"
promotion         = false
publication       = "BLOCKED"
lean              = "OPEN"
canonical_domain  = 1176
deprecated_domain = 5720

[governance.notes]
canonical_domain  = "2<=m<=8, 2<=k<=8, 1<=s<=m*k-1. Total 1176 cases."
deprecated_domain = "Historical only. Must not appear as an active execution count."
